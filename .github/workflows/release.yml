name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The full nightly matrix on the tag commit: a release publishes only when every JDK/Hibernate/database leg passes
  matrix:
    uses: ./.github/workflows/nightly.yml

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Set version from tag
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false -DprocessAllModules

      # AC-REL-05: the tag commit's time becomes project.build.outputTimestamp, so a rebuild of the tag is identical.
      - name: Set build timestamp from the tag commit
        run: >
          ./mvnw -B -ntp versions:set-property -Dproperty=project.build.outputTimestamp
          -DnewVersion="$(git log -1 --format=%cI)" -DgenerateBackupPoms=false

      - name: Build, sign and publish to Maven Central
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
