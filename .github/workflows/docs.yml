name: Docs

# Publishes the user guide under docs/site to GitHub Pages from main (D-79). CI's docs-site job checks it on every PR.
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - run: mkdocs build --strict -f docs/site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
