name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  # Release runs this matrix before publishing (R-QA-09)
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    name: JDK ${{ matrix.java }} / Hibernate ${{ matrix.hibernate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
        hibernate:
          - { name: '6.6', version: 6.6.58.Final, jpa: 3.1.0 }
          - { name: '7.x', version: 7.4.11.Final, jpa: 3.2.0 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Database versions (PostgreSQL 14-17, MySQL 8.0/8.4) are iterated inside the TCK by -Dtck.full-matrix=true
      # (R-QA-09). Tier-2/3 vendor profiles (R-PRF-02) join this matrix when they exist; none does yet.
      - run: >
          ./mvnw -B -ntp verify
          -Dhibernate.version=${{ matrix.hibernate.version }}
          -Djakarta-persistence.version=${{ matrix.hibernate.jpa }}
          -Dtck.full-matrix=true
