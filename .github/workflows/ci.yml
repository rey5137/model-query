name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # One verify is the whole R-QA-08 gate: build, unit tests, ArchUnit layering (INV-7), SQL-snapshot diff, and the
      # TCK on H2, PostgreSQL 17 and MySQL 8.4 through Testcontainers (Docker is available on ubuntu-latest)
      - run: ./mvnw -B -ntp verify

  ac-audit:
    name: AC audit (R-QA-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # python3 is preinstalled on ubuntu-latest; the scripts use only the standard library
      - run: python3 .github/scripts/ac_audit_selftest.py
      - run: python3 .github/scripts/ac_audit.py

  release-check:
    name: Release dry run (AC-REL-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # AC-REL-04 dry run: sign with a throwaway key generated here (no passphrase), skip the upload to Central, then
      # check every published module has signed main, -sources and -javadoc jars and that the BOM lists them all
      - name: Generate a throwaway signing key
        run: gpg --batch --passphrase '' --quick-gen-key 'release dry run <dry-run@example.invalid>' rsa3072 sign 1d
      - run: ./mvnw -B -ntp -Prelease -DskipTests -DskipPublishing=true deploy
      - run: python3 .github/scripts/release_dry_run_check.py

  reproducible:
    name: Reproducible build (AC-REL-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: python3 .github/scripts/reproducible_build.py

  docs-site:
    name: Docs site (D-76)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      # A broken link, a page missing from the nav or a missing file fails the build; docs.yml deploys it from main (D-79)
      - run: mkdocs build --strict -f docs/site/mkdocs.yml

  mutation:
    name: Mutation testing (R-QA-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # PIT on the jpa keyset predicate builder (Keyset); fails below the 100% threshold in model-query-jpa/pom.xml.
      # -am compiles core from the reactor, so nothing is installed; other modules skip PIT (pluginManagement skip)
      - run: ./mvnw -B -ntp -pl model-query-jpa -am test-compile org.pitest:pitest-maven:mutationCoverage
