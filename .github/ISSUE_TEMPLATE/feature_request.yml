name: Feature request
description: Suggest an API, a filter operator or a vendor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current API doesn't cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: java
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
