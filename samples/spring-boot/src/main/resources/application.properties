# Three databases, one factory each. Point the PostgreSQL and MySQL urls at your own servers.
sample.h2.url=jdbc:h2:mem:sample;DB_CLOSE_DELAY=-1
sample.h2.username=sa
sample.postgres.url=jdbc:postgresql://localhost:5432/sample
sample.postgres.username=sample
sample.postgres.password=sample
sample.mysql.url=jdbc:mysql://localhost:3306/sample
sample.mysql.username=sample
sample.mysql.password=sample
